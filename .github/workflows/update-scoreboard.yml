name: Atualizar placar WAGS CHECKPOINTS

on:
  schedule:
    - cron: "0 11,17 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install google-api-python-client google-auth

      - name: Gerar scoreboard.json
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          XFORCE_EMAIL: ${{ secrets.XFORCE_EMAIL }}
        run: python scripts/generate_scoreboard.py

      - name: Commit se houver mudanca
        run: |
          git config user.name "wags-checkpoints-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scoreboard.json
          git diff --quiet --cached || git commit -m "chore: atualiza placar automatico"
          git push
